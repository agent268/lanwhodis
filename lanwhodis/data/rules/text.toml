[[rule]]
match = 'truenas|unraid|openmediavault|freenas'
votes = { nas = 0.6, server = 0.3 }

[[rule]]
match = 'plex media server|plex'
votes = { media_server = 0.9 }

[[rule]]
match = 'jellyfin|emby|minidlna|serviio|mediatomb|gerbera|universal media server|twonky'
