[[rule]]
match = '\bkodi\b'
votes = { media_server = 0.5, computer = 0.2 }

[[rule]]
match = 'mediaserver'
votes = { media_server = 0.6 }

[[rule]]
match = 'openwrt|dd-wrt|tomato|pfsense|opnsense|routeros|edgeos|mikrotik|asuswrt|fritz!?box'
votes = { router = 0.8 }

[[rule]]
