# Free-text rules: regex searched in model strings, UPnP/HTTP Server headers, HTTP <title>,
# SSH/RTSP banners and other captured text.

[[rule]]
match = 'iphone\d+,\d+'
votes = { phone = 0.98 }

[[rule]]
match = 'ipad\d+,\d+'
votes = { tablet = 0.98 }

[[rule]]
match = 'macbook'
votes = { laptop = 0.95 }

[[rule]]
match = 'macmini|imac|macpro|macstudio'
votes = { computer = 0.9 }

[[rule]]
match = 'appletv\d'
votes = { streaming = 0.98 }

[[rule]]
match = 'audioaccessory'
votes = { speaker = 0.98 }

[[rule]]
match = '\broku\b'
votes = { streaming = 0.9 }

[[rule]]
match = 'xbox'
votes = { game_console = 0.95 }

[[rule]]
match = 'playstation'
votes = { game_console = 0.95 }

[[rule]]
match = 'nintendo'
votes = { handheld_console = 0.5, game_console = 0.3 }

[[rule]]
match = 'steam ?deck|jupiter'
votes = { handheld_console = 0.9 }

[[rule]]
match = 'chromecast'
votes = { streaming = 0.95 }

[[rule]]
match = 'nest (mini|audio|hub)|home (mini|max)|google home|lenovo ?(cd|smart (clock|display))|smart clock'
votes = { speaker = 0.93 }

[[rule]]
match = 'nest wifi|nest ?wifi point'
votes = { access_point = 0.8, router = 0.3 }

[[rule]]
match = 'google tv|android tv|androidtv|bravia|webos|tizen|smart ?tv|vizio|hisense|\btcl\b'
votes = { tv = 0.7 }

[[rule]]
match = 'fire ?tv'
votes = { streaming = 0.9 }

[[rule]]
match = 'apple ?tv'
votes = { streaming = 0.95 }

[[rule]]
match = 'homepod'
votes = { speaker = 0.95 }

[[rule]]
match = 'echo (dot|show|studio|pop)|alexa'
votes = { speaker = 0.75 }

[[rule]]
match = 'sonos'
votes = { speaker = 0.95 }

[[rule]]
match = 'hue bridge|philips hue'
votes = { hub = 0.85 }

[[rule]]
match = 'internetgatewaydevice|wanipconnection'
votes = { router = 0.9 }

[[rule]]
match = 'hikvision|dahua|reolink|amcrest|foscam|ip ?camera|network camera|onvif|\bdvr\b|\bnvr\b|webcam'
votes = { camera = 0.8 }

[[rule]]
match = 'printer|laserjet|officejet|deskjet|inkjet|\bmfp\b|laserwriter|ecotank|pixma'
votes = { printer = 0.9 }

[[rule]]
match = 'synology|diskstation|qnap|readynas'
