# OS detection rules. See osdetect.py for how votes are combined.

# --- text rules: regex in banners/UPnP/model/name text -> OS family (+ optional detail; \1 = capture) ---

[[text]]
match = '^local-os: windows'
family = 'Windows'
weight = 0.99

[[text]]
match = '^local-os: darwin'
family = 'macOS'
weight = 0.99

# SMB NTLM challenge (discovery/smb.py): the server reports its real Windows version.
[[text]]
match = '^smb-ntlm: (.+)'
family = 'Windows'
detail = '\1'
weight = 0.97

# A SMB server that reports no NTLM version is Samba or embedded firmware - a weak hint, hidden unless
# something else (TTL, banners) agrees.
[[text]]
match = '^smb-server: samba-or-embedded'
family = 'Linux'
detail = 'Samba (probable)'
weight = 0.22

[[text]]
match = '^local-os: linux \| (.+)'
family = 'Linux'
detail = '\1'
weight = 0.99

[[text]]
match = '^local-os: linux \|.*steamos'
family = 'Linux'
detail = 'SteamOS'
weight = 0.995

[[text]]
match = '^local-os: linux'
family = 'Linux'
weight = 0.99

[[text]]
match = 'openssh_for_windows'
family = 'Windows'
weight = 0.95

