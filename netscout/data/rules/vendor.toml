# Vendor rules: regex searched (case-insensitive) in the OUI / UPnP manufacturer string.
# `votes` maps device type -> weight (0..1). Weights for the same type combine by noisy-OR.
# Device types are listed in netscout/devtypes.py.

[[rule]]
match = 'raspberry pi'
votes = { raspberry_pi = 0.9 }

[[rule]]
match = '\bsonos\b'
votes = { speaker = 0.95 }

[[rule]]
match = '\broku\b'
votes = { streaming = 0.9 }

[[rule]]
match = 'nintendo'
votes = { handheld_console = 0.4, game_console = 0.6 }

[[rule]]
match = 'sony interactive'
votes = { game_console = 0.92 }

[[rule]]
match = 'valve corp'
votes = { handheld_console = 0.5, game_console = 0.3, computer = 0.2 }

[[rule]]
match = 'ayaneo|anbernic|retroid|\bayn\b|\bgpd\b|powkiddy'
votes = { handheld_console = 0.7 }

[[rule]]
match = 'espressif'
votes = { iot = 0.7, smart_plug = 0.15 }

[[rule]]
match = 'tuya'
votes = { iot = 0.8, smart_plug = 0.2 }

[[rule]]
match = 'ubiquiti|ubnt'
votes = { access_point = 0.4, switch = 0.15, router = 0.15 }

[[rule]]
match = 'tp-?link'
votes = { router = 0.3, access_point = 0.25, smart_plug = 0.12, extender = 0.1 }

[[rule]]
match = 'netgear'
votes = { router = 0.35, access_point = 0.2, extender = 0.15 }

[[rule]]
match = '\barlo\b'
votes = { camera = 0.85 }

[[rule]]
match = '\basus(tek)?\b'
votes = { router = 0.25, computer = 0.25, laptop = 0.15 }

[[rule]]
match = 'linksys|tenda|mercusys|totolink|cudy|wavlink|engenius|edimax|zyxel|trendnet|d-?link'
