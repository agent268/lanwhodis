[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netscout"
version = "0.1.0"
description = "Local network device scanner for consumer and SMB gear (CLI + GUI)"
requires-python = ">=3.11"
dependencies = [
    "zeroconf>=0.130",
    "psutil>=5.9",
    "openpyxl>=3.1",
    "reportlab>=4.0",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = ["pytest>=8"]

[project.scripts]
netscout = "netscout.cli:main"

[project.gui-scripts]
netscout-gui = "netscout.gui.app:main"

[tool.setuptools.packages.find]
include = ["netscout*"]

[tool.setuptools.package-data]
netscout = ["data/*", "data/rules/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
