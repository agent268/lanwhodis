[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lanwhodis"
version = "0.1.0"
description = "Local network device scanner for consumer and SMB gear (CLI + GUI)"
requires-python = ">=3.11"
dependencies = [
    "zeroconf>=0.130",
    "psutil>=5.9",
    "openpyxl>=3.1",
    "reportlab>=4.0",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = ["pytest>=8"]

[project.scripts]
lanwhodis = "lanwhodis.cli:main"

[project.gui-scripts]
lanwhodis-gui = "lanwhodis.gui.app:main"

[tool.setuptools.packages.find]
include = ["lanwhodis*"]

[tool.setuptools.package-data]
lanwhodis = ["data/*", "data/rules/*.toml", "data/recog/*", "gui/assets/icons/*", "gui/qml/*.qml",
             "gui/qml/LanWhodis/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
